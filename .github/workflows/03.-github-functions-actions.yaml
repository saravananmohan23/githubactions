name:  newworflow
on: 
  push
workflow_dispatch:
jobs:
   sarav:
     runs-on: ubuntu-latest
     defaults:
      
       run:
         working-directory: ./04-usingnodejs/react-app
     steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18  
      - name: install dependencies
        run: npm ci
      - name: run tests
        run: npm test
      - name: build project
        run: npm run build
      - name: deploy to production
        run: echo "Deploying to production environment..."    